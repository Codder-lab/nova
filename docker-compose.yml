version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: nova-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=nova

  redis:
    image: redis:7-alpine
    container_name: nova-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
